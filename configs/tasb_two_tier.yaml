run_ivfpq: true
run_hnsw:  false
run_np:    false

build_mode: "split" # "complete" | "split"

# FAISS IVFPQ
ivf_nlist: 8192
pq_m: 64              
pq_nbits: 8
nprobe: 128
nprobe_rel: 2

# HNSW
hnsw_ef_search: 64

# gating
margin_abs: 1
#margin_abs: 0.009
entropy_tau: 1.0
entropy_frac: 0.5
entropy_topn: 20

#############
# Anti-OOM / build streaming
train_cap:   3_000_000      # doc per il train dell’IVFPQ
build_chunk: 25_000      # doc per add per chunk